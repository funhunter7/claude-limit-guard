name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The status-line/format tests assert wall-clock time formatting against fixtures
    # written with +02:00 offsets. Pin the timezone so they are deterministic on the
    # UTC runner (and match a local run in CET/CEST). See test/format.test.mjs.
    env:
      TZ: Europe/Prague
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
